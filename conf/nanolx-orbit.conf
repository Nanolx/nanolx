    curl -A "${USER_AGENT}" -sL "https://www.citrix.com/downloads/citrix-endpoint-analysis/plug-ins/EPA-Clients-Linux.html" > ${pkg_base}/ctx_epa.html &
    pid_epa=$!

    wait ${pid_ctx} ${pid_beta} ${pid_epa}
