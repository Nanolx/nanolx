run_curl=false

if [ ! -f "${pkg_base}/ctx_base.html" ]; then
    run_curl=true
else
    now=$(date +%s)
    last_mod=$(stat -c %Y "${pkg_base}/ctx_base.html")
    if [ $((now - last_mod)) -gt 1800 ]; then
        run_curl=true
    fi
fi

if [ "${run_curl}" = true ]; then
    echo -e "Gathering Citrix information (takes a few seconds).\n"

    curl -A "${USER_AGENT}" -sL "https://www.citrix.com/downloads/workspace-app/linux/workspace-app-for-linux-latest.html" > ${pkg_base}/ctx_base.html &
    pid_ctx=$!

